info:
  name: Create Lead
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/leads"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "sellerId": "{{sellerId}}",
        "propertyId": "{{propertyId}}",
        "source": "ENQUIRY_FORM",
        "name": "Ravi Kumar",
        "email": "ravi.kumar@example.com",
        "phone": "9812345678",
        "message": "Interested in the 3 BHK apartment in Lower Parel. Please share the brochure and confirm the best time to visit the site this weekend."
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
