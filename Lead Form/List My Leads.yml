info:
  name: List My Leads
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/leads/me?page=1&limit=10&status=NEW&source=ENQUIRY_FORM&propertyId={{propertyId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: x-organization-id
      value: "{{organizationId}}"

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
