info:
  name: Public OTP verify
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/private-otp-verify"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "identifier": "8687544227",
        "code": "512761",
        "purpose": "PHONE_VERIFICATION" 
      }

runtime:
