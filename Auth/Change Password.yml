info:
  name: Change Password
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/auth/me/password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "currentPassword": "Test@123",
        "newPassword": "NewPass@456"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
