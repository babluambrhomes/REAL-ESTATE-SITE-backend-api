info:
  name: 01 Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      
      {
        "phone": "9870000002",
        "firstName": "Amit Sharma"
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
