info:
  name: private  OTP verify
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/private-otp-verify"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "code": "858066",
        "purpose": "EMAIL_VERIFICATION" 
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
