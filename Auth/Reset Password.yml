info:
  name: Reset Password
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
        "newPassword": "NewPass@456"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
