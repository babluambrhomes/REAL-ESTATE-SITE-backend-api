info:
  name: Update Contact
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/auth/me/contact"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |+
      {
        "phone": "8758657"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
