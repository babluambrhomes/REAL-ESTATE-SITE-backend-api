info:
  name: Get Document File
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/sellers/kyc/documents/{{kycDocumentId}}/file"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: ""

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000
    - name: kycDocumentId
      value: 246f951d-d0b1-445e-b6c8-f6948c7e772e

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
