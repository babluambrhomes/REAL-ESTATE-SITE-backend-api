info:
  name: Assign Inquiry
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/organizations/{{organizationId}}/inquiries/me/{{inquiryId}}/assign"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "memberId": "{{memberId}}"
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
