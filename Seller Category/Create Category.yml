info:
  name: Create Category
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/seller-categories"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "name": "Residential",
        "slug": "residential",
        "description": "Residential properties available for sale and rent",
        "isActive": true
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
