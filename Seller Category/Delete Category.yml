info:
  name: Delete Category
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/seller-categories/{{sellerCategoryId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: ""

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
