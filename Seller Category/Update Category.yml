info:
  name: Update Category
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/seller-categories/{{sellerCategoryId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "name": "Residential Properties",
        "slug": "residential-properties",
        "description": "Apartments, villas and independent houses available for sale and rent across all major Indian cities.",
        "isActive": true
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
