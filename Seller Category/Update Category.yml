info:
  name: Update Category
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/seller-categories/{{sellerCategoryId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "name": "Residential",
        "slug": "residential",
        "description": "Residential properties for sale, rent and lease",
        "isActive": false
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
