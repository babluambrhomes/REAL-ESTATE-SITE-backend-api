info:
  name: Upload Category Image
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/seller-categories/{{sellerCategoryId}}/image"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: multipart-form
    data:
      - name: image
        type: file
        value: []

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
