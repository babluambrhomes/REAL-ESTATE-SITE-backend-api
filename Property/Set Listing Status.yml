info:
  name: Set Listing Status
  type: http
  seq: 20

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/properties/{{propertyId}}/listing-status"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "listingStatus": "PUBLISHED"
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
