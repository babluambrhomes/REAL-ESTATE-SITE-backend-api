info:
  name: Get My Property
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/properties/my/{{propertyId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
