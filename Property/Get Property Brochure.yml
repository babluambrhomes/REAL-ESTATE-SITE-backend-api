info:
  name: Get Property Brochure
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseUrl}}/api/v1/properties/{{propertyId}}/variants/{{variantId}}/brochure"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
