info:
  name: Set Property Images
  type: http
  seq: 10

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/properties/{{propertyId}}/images"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "images": [
          {
            "url": "/uploads/property/sample-3bhk-living-room.webp",
            "isFeatured": true
          },
          {
            "url": "/uploads/property/sample-2bhk-living-room.webp",
            "isFeatured": false
          }
        ]
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
