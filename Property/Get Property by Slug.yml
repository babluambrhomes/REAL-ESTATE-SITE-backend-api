info:
  name: Get Property by Slug
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/properties/{{propertySlug}}"
  headers:
    - name: Content-Type
      value: application/json

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
