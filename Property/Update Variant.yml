info:
  name: Update Variant
  type: http
  seq: 14

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/properties/{{propertyId}}/variants/{{variantId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "price": "17200000",
        "mrpPrice": "19200000",
        "inventoryCount": 3,
        "furnishingStatus": "SEMI_FURNISHED"
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
