info:
  name: Toggle Property Active
  type: http
  seq: 18

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/properties/{{propertyId}}/toggle-active"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "isActive": false
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
