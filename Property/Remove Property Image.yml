info:
  name: Remove Property Image
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/properties/{{propertyId}}/images"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "url": "/uploads/property/sample-2bhk-living-room.webp"
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
