info:
  name: Upload Variant Images
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/v1/properties/{{propertyId}}/variants/{{variantId}}/images"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: multipart-form
    data:
      - name: images
        type: file
        value: []

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
