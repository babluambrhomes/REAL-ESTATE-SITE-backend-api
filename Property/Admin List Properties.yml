info:
  name: Admin List Properties
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/api/v1/properties/admin?page=1&limit=10&propertyStatus=AVAILABLE&listingStatus=PUBLISHED&verificationStatus=PENDING&organizationId={{organizationId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
