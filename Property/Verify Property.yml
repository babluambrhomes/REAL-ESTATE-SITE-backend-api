info:
  name: Verify Property
  type: http
  seq: 17

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/properties/{{propertyId}}/verify"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "verificationStatus": "VERIFIED"
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
