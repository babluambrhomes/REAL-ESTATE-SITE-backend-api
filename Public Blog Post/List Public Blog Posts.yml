info:
  name: List Public Blog Posts
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/blog-posts?page=1&limit=10&tag=Home%20Buying&q=booking%20amount"
  headers:
    - name: Content-Type
      value: application/json

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
