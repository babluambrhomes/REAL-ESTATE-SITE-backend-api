info:
  name: Delete Seller Question
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/buyer-questions/seller/{{buyerQuestionId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: x-organization-id
      value: "{{organizationId}}"
  body:
    type: json
    data: ""

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
