info:
  name: Update My Question
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/buyer-questions/me/{{buyerQuestionId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "question": "Is the price negotiable for the 3 BHK variant? Also please confirm whether the quoted figure includes the clubhouse membership and covered parking charges."
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
