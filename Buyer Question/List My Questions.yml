info:
  name: List My Questions
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/buyer-questions/me?page=1&limit=10&status=PENDING"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
