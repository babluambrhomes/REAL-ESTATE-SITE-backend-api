info:
  name: List Seller Questions
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v1/buyer-questions/seller?page=1&limit=10&status=PENDING&propertyId={{propertyId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: x-organization-id
      value: "{{organizationId}}"

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
