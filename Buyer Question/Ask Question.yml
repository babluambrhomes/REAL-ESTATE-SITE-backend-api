info:
  name: Ask Question
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/buyer-questions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "sellerId": "{{sellerId}}",
        "propertyId": "{{propertyId}}",
        "question": "Is the price negotiable for the 3 BHK variant, and does the quoted figure include the clubhouse and parking charges?"
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
