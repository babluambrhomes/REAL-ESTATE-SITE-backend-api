info:
  name: Get My Profile
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/sellers/me"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: ""

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
