info:
  name: Become Seller
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/sellers/become-seller"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "name": "Amit Sharma",
        "categoryId": "{{sellerCategoryId}}",
        "panNumber": "ABCDE1234F",
        "aadhaarNumber": "1234 5678 9012",
        "reraNumber": "A51900012345",
        "headline": "Premium property consultant in Mumbai",
        "about": "I help buyers find and negotiate premium residential and commercial properties across Mumbai. Fifteen years of experience with RERA verified projects only.",
        "experienceYears": 12,
        "specializations": ["Residential", "Commercial", "Luxury"],
        "languages": ["English", "Hindi", "Marathi"],
        "addressLine": "403, Sun City, Andheri West",
        "city": "Mumbai",
        "state": "Maharashtra",
        "country": "India",
        "pincode": "400053",
        "contactPhone": "9876543210",
        "contactEmail": "amit.sharma@example.com",
        "showContactToBuyers": true,
        "isAvailable": true,
        "happyClientsCount": 180,
        "responseTimeMinutes": 30
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
