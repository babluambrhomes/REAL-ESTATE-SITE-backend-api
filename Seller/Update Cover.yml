info:
  name: Update Cover
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/sellers/me/cover"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: multipart-form
    data:
      - name: cover
        type: file
        value: []

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
