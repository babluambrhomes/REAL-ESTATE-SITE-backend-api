info:
  name: Update My Slug
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/sellers/me/slug"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "slug": "sharma-realty"
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
