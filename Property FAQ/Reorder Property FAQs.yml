info:
  name: Reorder Property FAQs
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/property-faqs/reorder"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "propertyId": "{{propertyId}}",
        "faqs": [
          {
            "id": "{{propertyFaqId}}",
            "displayOrder": 0
          }
        ]
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
