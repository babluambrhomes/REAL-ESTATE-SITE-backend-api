info:
  name: Delete Seller FAQ
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/sellers/me/faqs/{{sellerFaqId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: ""

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
