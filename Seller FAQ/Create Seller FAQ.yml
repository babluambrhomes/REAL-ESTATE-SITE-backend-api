info:
  name: Create Seller FAQ
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/sellers/me/faqs"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "question": "Do you charge brokerage on rental properties?",
        "answer": "Yes, for rentals we charge one month of rent as brokerage from the tenant, or a 2 percent commission from the landlord, whichever the parties agree upfront. The exact split is always documented in the agreement before you sign.",
        "displayOrder": 1,
        "isActive": true
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
