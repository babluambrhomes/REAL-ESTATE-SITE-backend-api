info:
  name: Update Site Visit Status
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/site-visits/seller/{{siteVisitId}}/status"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: x-organization-id
      value: "{{organizationId}}"
  body:
    type: json
    data: |-
      {
        "status": "CONFIRMED",
        "comment": "Visit confirmed. Our sales manager will meet the buyer at the gate at 10:30 AM."
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
