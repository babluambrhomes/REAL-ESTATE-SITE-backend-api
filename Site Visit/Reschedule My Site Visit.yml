info:
  name: Reschedule My Site Visit
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/site-visits/me/{{siteVisitId}}/reschedule"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "visitDate": "2026-11-22",
        "startTime": "2026-11-22T15:00:00.000Z",
        "endTime": "2026-11-22T16:00:00.000Z",
        "comment": "Please shift the visit to Sunday afternoon, I have a meeting in the morning."
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
