info:
  name: Reschedule Seller Site Visit
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/site-visits/seller/{{siteVisitId}}/reschedule"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: x-organization-id
      value: "{{organizationId}}"
  body:
    type: json
    data: |-
      {
        "visitDate": "2026-11-23",
        "startTime": "2026-11-23T11:00:00.000Z",
        "endTime": "2026-11-23T12:00:00.000Z",
        "comment": "Society security is on strike that day, moving the visit to the next morning."
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
