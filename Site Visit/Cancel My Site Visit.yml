info:
  name: Cancel My Site Visit
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/site-visits/me/{{siteVisitId}}/cancel"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "reason": "Plans changed, will book a new slot next week."
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
