info:
  name: List My Site Visits
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/site-visits/me?page=1&limit=10&status=PENDING&upcoming=true&from=2026-10-01T00:00:00.000Z&to=2026-12-31T23:59:59.000Z"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
