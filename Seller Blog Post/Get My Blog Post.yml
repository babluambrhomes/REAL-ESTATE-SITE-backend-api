info:
  name: Get My Blog Post
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/sellers/me/blog-posts/{{blogPostId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: x-organization-id
      value: "{{organizationId}}"

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
