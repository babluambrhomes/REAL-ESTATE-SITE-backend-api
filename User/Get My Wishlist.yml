info:
  name: Get My Wishlist
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/wishlist?page=1&limit=10"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
