info:
  name: Remove Organization Member
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/organizations/{{organizationId}}/members/{{memberId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
