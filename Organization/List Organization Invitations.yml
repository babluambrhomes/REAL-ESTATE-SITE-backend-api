info:
  name: List Organization Invitations
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/v1/organizations/{{organizationId}}/invitations"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
