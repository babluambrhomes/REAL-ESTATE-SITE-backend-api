info:
  name: Accept Invitation
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/v1/organizations/invitations/accept"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "token": "{{invitationToken}}"
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
