info:
  name: Invite Member
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/v1/organizations/{{organizationId}}/invitations"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "email": "newhire@sharmarealty.example.com",
        "phone": "9811122233",
        "roleId": "{{roleId}}",
        "expiresInHours": 72
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
